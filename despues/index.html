<!doctype html>
<html>
  <head>
    <title>Chat Socket.IO UNA</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { font: 13px Helvetica, Arial; }
      #auth-bar { background: #222; color: #fff; padding: 8px 10px; position: fixed; top: 0; width: 100%; z-index: 2; }
      #auth-bar button { margin-left: 8px; padding: 4px 10px; }
      #auth-status { margin-right: 8px; }
      form { background: #000; padding: 3px; position: fixed; bottom: 0; width: 100%; }
      form input { border: 0; padding: 10px;}
      form button { width: 10%; background: rgb(130, 224, 255);  border: none; padding: 10px; }
      form.disabled { opacity: 0.5; pointer-events: none; }
      #messages { list-style-type: none; margin: 0; padding: 0; margin-top: 36px; }
      #messages li { padding: 5px 10px; }
      #messages li:nth-child(odd) { background: #eee; }
      #messages { margin-bottom: 40px }
      #nombre-display, #m { display: inline-block;}
      #m {width: 69%; margin-right: 4px;}
      #nombre-display {width: 20%; background: #eee; color: #333; }
    </style>
  </head>
  <body>
    <div id="auth-bar">
      <span id="auth-status">No autenticado</span>
      <button type="button" id="btn-login" style="display:none;">Iniciar sesión</button>
      <button type="button" id="btn-logout" style="display:none;">Cerrar sesión</button>
    </div>
    <ul id="messages"></ul>
    <form id="chat-form" class="disabled" action="">
      <input id="nombre-display" readonly placeholder="Usuario" />
      <input id="m" autocomplete="off" placeholder="Escriba un mensaje" disabled /><button disabled>Send</button>
    </form>
    <script src="https://cdn.socket.io/4.7.2/socket.io.js"></script>
    <script src="https://code.jquery.com/jquery-1.11.1.js"></script>
    <script src="/vendor/auth0/auth0-spa-js.production.js"></script>
    <script>

    var colorHexTxt = "";
    var socket = null;
    var auth0Client = null;
    var auth0Config = null;
    var sessionAuthenticated = false;

    function getRandomColor() {
        var letters = '0123456789ABCDEF';
        var color = '#';
        for (var i = 0; i < 6; i++) {
          color += letters[Math.floor(Math.random() * 16)];
        }
        return color;
     }

    function setGuestState(statusText) {
      sessionAuthenticated = false;
      $('#chat-form').addClass('disabled');
      $('#m, #chat-form button').prop('disabled', true);
      $('#nombre-display').val('');
      $('#auth-status').text(statusText || 'No autenticado');
      $('#btn-login').show();
      $('#btn-logout').hide();
    }

    function setAuthenticatedState(displayName, chatReady) {
      sessionAuthenticated = true;
      $('#nombre-display').val(displayName || '');
      $('#auth-status').text(
        chatReady
          ? ('Conectado como ' + (displayName || ''))
          : ('Sesión iniciada como ' + (displayName || '') + ' — conectando chat…')
      );
      $('#btn-login').hide();
      $('#btn-logout').show();
      if (chatReady) {
        $('#chat-form').removeClass('disabled');
        $('#m, #chat-form button').prop('disabled', false);
      } else {
        $('#chat-form').addClass('disabled');
        $('#m, #chat-form button').prop('disabled', true);
      }
    }

    function bindSocketHandlers(displayName) {
      socket.on('Evento-Mensaje-Server', function(msg){
        var msgJson = JSON.parse(msg);
        var item = $('<li>');
        var nameEl = $('<b>');
        var color = typeof msgJson.color === 'string' ? msgJson.color : '';
        if (/^#?[0-9a-fA-F]{3}([0-9a-fA-F]{3})?$/.test(color)) {
            nameEl.css('color', color.charAt(0) === '#' ? color : '#' + color);
        }
        nameEl.text(msgJson.nombre || '');
        item.append(nameEl);
        item.append(document.createTextNode(': '));
        item.append($('<span>').html(msgJson.mensaje || ''));
        $('#messages').append(item);
        window.scrollTo(0, document.body.scrollHeight);
      });
      socket.on('connect_error', function (err) {
        console.error('Socket connect_error', err && err.message);
        if (sessionAuthenticated) {
          setAuthenticatedState(displayName, false);
          $('#auth-status').text('Sesión activa — no se pudo conectar al chat (token o red)');
        } else {
          setGuestState('No autenticado');
        }
      });
    }

    async function getAccessToken() {
      return auth0Client.getTokenSilently({
        authorizationParams: {
          audience: auth0Config.audience,
          redirect_uri: window.location.origin
        }
      });
    }

    function connectSocketWithToken(token, displayName) {
      if (socket) {
        socket.disconnect();
        socket = null;
      }
      setAuthenticatedState(displayName, false);
      socket = io({ auth: { token: token } });
      bindSocketHandlers(displayName);
      socket.on('connect', function () {
        setAuthenticatedState(displayName, true);
      });
    }

    function bindChatForm() {
      $('#chat-form').submit(function(){
          if (!socket || !socket.connected) {
            return false;
          }
          var mensajeTxt = $('#m').val();
          if (colorHexTxt === "") {
              colorHexTxt = getRandomColor();
          }
          var jsonMsg = { nombre: '', mensaje: mensajeTxt, color: colorHexTxt };
          socket.emit('Evento-Mensaje-Server', JSON.stringify(jsonMsg));
          $('#m').val('');
          return false;
      });
    }

    async function performLogout() {
      if (socket) {
        socket.disconnect();
        socket = null;
      }
      $('#messages').empty();
      colorHexTxt = '';
      setGuestState('No autenticado');
      if (auth0Client) {
        await auth0Client.logout({ logoutParams: { returnTo: window.location.origin } });
      }
    }

    function bindLogoutButton() {
      $('#btn-logout').off('click').on('click', function () {
        performLogout();
      });
    }

    async function startTestAuthFlow() {
      $('#btn-login, #btn-logout').hide();
      var session = await fetch('/test/session-token?name=David').then(function (r) { return r.json(); });
      sessionAuthenticated = true;
      connectSocketWithToken(session.token, session.name);
      bindLogoutButton();
    }

    async function startAuth0Flow() {
      auth0Config = await fetch('/auth-config').then(function (r) { return r.json(); });
      if (!auth0Config.clientId) {
        setGuestState('No autenticado (configure AUTH0_CLIENT_ID en .env)');
        $('#btn-login').hide();
        return;
      }
      if (typeof auth0 === 'undefined' || typeof auth0.createAuth0Client !== 'function') {
        setGuestState('Error: no se cargó el SDK de Auth0');
        $('#btn-login').hide();
        return;
      }

      var authParams = {
        redirect_uri: window.location.origin,
        audience: auth0Config.audience
      };

      auth0Client = await auth0.createAuth0Client({
        domain: auth0Config.domain,
        clientId: auth0Config.clientId,
        authorizationParams: authParams,
        cacheLocation: 'localstorage'
      });

      var params = new URLSearchParams(window.location.search);
      if (params.has('code') && params.has('state')) {
        try {
          await auth0Client.handleRedirectCallback();
        } catch (err) {
          console.error('Auth0 redirect callback failed', err);
          setGuestState('Error al completar el inicio de sesión');
          $('#btn-login').show().off('click').on('click', function () {
            auth0Client.loginWithRedirect({ authorizationParams: authParams });
          });
          return;
        }
        window.history.replaceState({}, document.title, window.location.pathname);
      }

      bindLogoutButton();

      var isAuthenticated = await auth0Client.isAuthenticated();
      if (isAuthenticated) {
        await onAuth0LoggedIn();
      } else {
        setGuestState('No autenticado');
        $('#btn-login').off('click').on('click', function () {
          auth0Client.loginWithRedirect({ authorizationParams: authParams });
        });
      }
    }

    async function onAuth0LoggedIn() {
      var token = await getAccessToken();
      var user = await auth0Client.getUser();
      var displayName = (user && user.name) || (user && user.nickname) || (user && user.sub) || 'Usuario';
      connectSocketWithToken(token, displayName);
    }

      $(function () {
        bindChatForm();
        var params = new URLSearchParams(window.location.search);
        if (params.get('testAuth') === '1') {
          startTestAuthFlow();
        } else {
          startAuth0Flow().catch(function (err) {
            console.error('Auth0 flow failed', err);
            setGuestState('Error de autenticación');
          });
        }
      });
    </script>
  </body>
</html>
